[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
; supervisord 自己的 pid 写到 /tmp，不占 /app/data
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── 监控进程 ─────────────────────────────────────────────────────
[program:monitor]
command=python -u monitor.py
directory=/app
autostart=true
autorestart=true
; 崩溃后最多重启 10 次；若持续崩溃由 Docker healthcheck 兜底重启容器
startretries=10
; 优雅停止：先等 10 秒让 monitor 完成当前轮次
stopwaitsecs=10
; monitor 内部用 Python logging 写 data/monitor.log，不重复 capture
redirect_stderr=true
stdout_logfile=/app/logs/monitor_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ── Web 面板 ─────────────────────────────────────────────────────
[program:web]
; 使用 Gunicorn 生产 WSGI 服务器（替代 Flask 内置的 Werkzeug 开发服务器）
; --workers=1   : SQLite 单进程，避免多进程写锁冲突
; --threads=256 : 线程数 = **同时在线客户端数的上限**，见下
; --timeout=0   : 禁用 worker 超时，防止 SSE 长连接被强杀（默认 30s 会断连）
; web:app       : web.py 中的 Flask WSGI application 对象
;
; 为什么是 64 而不是 8
; --------------------
; 2026-09-05 全站打不开。原因不是崩溃，是**线程被占满**：
;
;   SSE_MAX_AGE_SECONDS = 300     每条通知流占住一条线程 5 分钟
;   retry: 2000                   客户端断开后 2 秒重连
;   --threads=8                   总共 8 条
;
; gunicorn 的 gthread worker 是**一请求一线程**，SSE 那条线程 5 分钟里
; 99% 的时间阻塞在 stop.wait(5) 上——不耗 CPU，但位子占着。于是稳态下
; 每个在线客户端长期占用一条线程，**8 个客户端就把整个站堵死**，第 9 个
; 请求排队直到有流到期。当时线上 31 条连接、81 台活跃设备。
;
; 症状极具误导性：容器 healthy（healthcheck 走 /health，早于队列排到它就
; 返回了）、日志一条 error 都没有、CPU 和内存都很闲。表现只是「页面转圈」。
;
; 所以这个数字不是性能调优参数，是**容量上限**：它必须大于预期的同时在线
; 客户端数，再留一截给普通页面请求。
;
; 当前的预算（2026-09-06）
; -----------------------
;   ~70   自动化测试并发跑的模拟器，每个启动后都会开一条通知流
;   ~40   真实客户端（线上 81 台活跃设备，不会同时全在线）
;   ~30   普通页面请求、API、健康检查
;   ----
;   ~140  再留一倍余量 → 256
;
; 第一版定的 64 是按「81 台设备不会全部同时连」算的，漏掉了测试那 70 个——
; 而正是一轮测试把 8 撞爆的。定这个数时要按**并发峰值**算，不是按日常。
;
; 为什么不换 gevent worker
; ------------------------
; gevent 能用几条线程扛几千条连接，看着是根治。但它 monkeypatch 之后，
; sqlite3 那些 C 层阻塞调用**不会**让出 hub——一条慢查询会卡住整个进程里
; 所有协程，比现在的线程模型更难排查。SSE 线程 99% 时间在 stop.wait(5) 上
; 睡着（会释放 GIL），线程模型在这里反而是安全的选择。
;
; 真要根治是给 SSE 连接数设上限并明确拒绝超出的，让客户端退化到轮询——
; 那是行为变更，不是配置调整。
command=gunicorn --workers=1 --threads=256 --timeout=0 --bind=0.0.0.0:8088 web:app
directory=/app
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
