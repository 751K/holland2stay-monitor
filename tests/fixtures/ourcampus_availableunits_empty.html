                               function BuildAptavailUrl(action)
                               {
                                   var Aptavail = document.getElementById('Aptavail');
                                   var query = [];
                                   action = action || Aptavail.action || window.location.pathname;

                                   for (var i = 0; i < Aptavail.elements.length; i++) {
                                       var field = Aptavail.elements[i];
                                       if (!field.name) {
                                           continue;
                                       }
                                       query.push(encodeURIComponent(field.name) + '=' + encodeURIComponent(field.value || ''));
                                   }

                                   if (query.length === 0) {
                                       return action;
                                   }

                                   var separator = action.indexOf('?') >= 0 ? '&' : '?';
                                   if (action.charAt(action.length - 1) === '?' || action.charAt(action.length - 1) === '&') {
                                       separator = '';
                                   }
                                   return action + separator + query.join('&');
                               }

	<script language='javascript'>                                                  
 	function datestringreplace(fullString,text,by) {	                                
 	// Replaces text with by in string	                                                
 	    var strLength = fullString.length, txtLength = text.length;	                    
 	    if ((strLength == 0) || (txtLength == 0)) return fullString;	                
 	    var i = fullString.indexOf(text);	                                            
 	    if ((!i) && (text != fullString.substring(0,txtLength))) return fullString;	    
 	    if (i == -1) return fullString;	                                                
 	    var newstr = fullString.substring(0,i) + by;	                                
 	    if (i+txtLength < strLength)	                                                
 	        newstr += datestringreplace(fullString.substring(i+txtLength,strLength),text,by);	
 	    return newstr;	                                                                
 	}	                                                                                
 	function datemask(mydate){	                                                        
 	    var mm='';                                                                      
 	    var dd='';                                                                      
 	    var yy='';                                                                      
 var mmLength = 0;                                                                    
 var ismasked = mydate.value.indexOf('-');                                            
 if (ismasked >= 0)  {                                                                
      var month1digitarr = mydate.value.split('-');                                   
      if (month1digitarr[1].length == 1) { mmLength = 1; }                               
     }                                                                                
 	    mydate.value = datestringreplace(mydate.value,'-','');	                        
 	    var dtlen = mydate.value.length;	                                            
 	    if (dtlen==0) {  return true ;}                                                 
 	    if (dtlen==4) {  mydate.value = '0' + mydate.value.substring(0,1) + '0' + mydate.value.substring(1) ;}  
 	    if (dtlen==6) {                                                                 
 	                    yy= mydate.value.substring(2,4);	                            
 	                    if (yy=='19' || yy=='20')                                       
 	                        {                                                           
 	                            mydate.value = '0' + mydate.value.substring(0,1) + '0' + mydate.value.substring(1) ; 
 	                        }                                                           
 	                    }                                                               
 	    if (dtlen==7) {                                                                 
                                      if (mmLength == 1){                            
 	                                        mydate.value = mydate.value.substring(0,2) + '0' + mydate.value.substring(2) ; 
                                          }else{                                      
 	                                            mydate.value = '0' + mydate.value ;     
                                          }                                           
 	                   }                                                                
 	    if (dtlen==9) {  mydate.value = '0' + mydate.value ;}                           
 	    mm= mydate.value.substring(0,2);	                                        
 	    dd= mydate.value.substring(2,4);	                                        
 	    yy= mydate.value.substring(4);	                                        
 	    if (yy.length == 2){	                                                        
 	        if (yy<50){	yy = '20'+yy; }                                                 
 	        else{	yy = '19'+yy; }	                                                    
 	    }	                                                                            
 	    mydate.value =  mm+'-'+dd+'-'+yy;	                                            
 	    return true ;	                                                                
 	}	                                                                                
</script>

        ClickTrack.CCQS = '';

    function CheckAndPassCTUserAndVisit() {
        var fnCTUVCnt = 0;
        var fnCTUVParamCheck;

        fnCTUVParamCheck = setInterval(AddClickTrackUserAndVisitToURL, 1000);

        function AddClickTrackUserAndVisitToURL() {
            fnCTUVCnt = fnCTUVCnt + .5;
            if (fnCTUVCnt >= 5) {
                $('.AddClickTrackParams').each(function () {
                    if ($(this).hasClass('ShowOnClickTrackParams')) $(this).css('display', '');
                });
                clearInterval(fnCTUVParamCheck);
            }
            if (typeof ClickTrack != "undefined") {
                if (typeof ClickTrack.getCookie('_yTrackVisit') != 'undefined' && ClickTrack.getCookie('_yTrackVisit') != null && ClickTrack.getCookie('_yTrackVisit') != 'null') {
                    $('.AddClickTrackParams').each(function () {
                        var sURLVal = $(this).attr("href");
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams(sURLVal));
                        if ($(this).hasClass('ShowOnClickTrackParams')) $(this).css('display', '');
                    });

                    $('#logo-container a').each(function () {
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams($(this).attr('href')));
                        // Use Alttest of image and use it for anchor tag aria-label. Check for null, empty, or 'NA'
                        var imgAlt = $(this).find('img').attr('alt');                       
                        if (!imgAlt || $.trim(imgAlt).toLowerCase() === 'na') {
                            imgAlt = 'Logo';
                        }
                        $(this).attr('aria-label', imgAlt);                        
                    });
                       
                    $('#apldiv a').each(function () {
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams($(this).attr('href')));
                    });
                        
                    $('#rpdiv a').each(function () {
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams($(this).attr('href')));
                    });

                    $('#mainNavbar ul li a:not(.donottrack)').each(function () {
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams($(this).attr('href')));
                    });

                    $('#login-links li a').each(function () {
                        $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams($(this).attr('href')));
                    });

                    /* Seach Each Anchor Tag from where user navigting to the Secure Site then contact CT Variables */
                    $("a:not(.donottrack)").each(function () {
                        var href = $(this).attr('href');
                        if (href != undefined) {
                            if (href.trim().toLowerCase().indexOf('securerc.co.uk'.toLowerCase()) > -1) {
                                $(this).attr('href', ClickTrack.GetTrackingCrossDomainURLParams(href));
                            }
                        }
                    });

                    clearInterval(fnCTUVParamCheck);
                }
            }
        }
    }

    $(document).ready(CheckAndPassCTUserAndVisit());

    $(document).ajaxComplete(CheckAndPassCTUserAndVisit());

</script>
