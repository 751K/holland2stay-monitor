# iOS 单元测试。
#
# 为什么单独一个 workflow 而不是并进 build.yml
# --------------------------------------------
# build.yml 只在打 tag 和手动触发时跑，产出的是 .dmg / .exe / .apk 安装包。
# 测试要在**每次推送**都跑，两者的触发条件天然不同。
#
# 为什么必须放云端
# ----------------
# 本地开发机装了 Xcode，但没有 iOS platform 的模拟器 runtime（Xcode >
# Settings > Components 里另外下载，几个 GB），于是 `xcodebuild` 连
# destination 都找不到：
#
#     error: iOS 26.5 is not installed.
#
# 结果是 Swift 改动只能靠 `swiftc -typecheck` 验类型，**跑不了一条测试**。
# GitHub 的 macOS runner 自带 Xcode + 若干 iOS 模拟器，正好补上这一环。
name: iOS Tests

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  # 同一分支上连续推送时，旧的跑一半就取消——模拟器测试很慢，排队没有意义。
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 先把环境打印出来。runner 镜像里的 Xcode 版本会随 GitHub 更新漂移，
      # 哪天挂了，第一眼要能看出是不是换了 Xcode / 模拟器列表变了。
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # 不写死 "iPhone 16" 之类的名字：GitHub 换镜像时那个型号可能就没了，
      # 而报错是 "no destinations"，看上去像项目坏了。挑选逻辑在
      # ios/scripts/pick_simulator.py，那边有单元测试。
      - name: Pick a simulator
        id: sim
        run: |
          PICKED=$(xcrun simctl list devices available --json \
            | python3 ios/scripts/pick_simulator.py)
          echo "选中：$(echo "$PICKED" | cut -f2-3)"
          echo "udid=$(echo "$PICKED" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 只跑单元测试。FlatRadarUITests 里是 App Store 截图自动化——每条用例
      # 都要重启 App、走完整页面，慢且与正确性无关，不该挡住合并。
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/FlatRadar/FlatRadar.xcodeproj \
            -scheme FlatRadar \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FlatRadarTests \
            -resultBundlePath ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | { command -v xcpretty >/dev/null && xcpretty || cat; }
          # xcpretty 不一定在镜像里；没有就原样打印。退出码必须取 xcodebuild
          # 那一段，否则格式化工具成功就把测试失败吞掉了。

      # 失败时把 result bundle 传上来：xcodebuild 的终端输出经常只说
      # "Test Suite failed"，具体哪条断言、什么值要开这个包才看得到。
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios-tests.xcresult
          retention-days: 7
