# App Store 截图自动化。
#
# 为什么必须在云端
# ----------------
# 本地开发机装了 Xcode，但一个 iOS 模拟器 runtime 都没有（`xcrun simctl list
# runtimes` 是空的），截图测试连 destination 都找不到。GitHub 的 macOS runner
# 自带若干模拟器，正好补上这一环。同 ios.yml。
#
# 为什么手动触发而不是每次推送
# ----------------------------
# 一次跑 2 种尺寸 × 5 种语言 = 10 轮 UI 测试，每轮要重启 App 七次。这既慢又与
# 代码正确性无关，不该挡住合并——只在准备提交 App Store 审核时跑。
name: App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: '要跑的语言（空格分隔）'
        default: 'en-US zh-Hans zh-Hant nl-NL es-ES'
      display_types:
        description: '要跑的显示类型（空格分隔）'
        default: 'APP_IPHONE_61 APP_IPAD_PRO_3GEN_129'
      only_testing:
        description: '只跑某几条用例（xcodebuild -only-testing 的值）。留空跑全部。'
        default: ''

concurrency:
  # 组名必须带上设备类型。
  #
  # 只用 github.ref 的话，iPhone 和 iPad 两次 dispatch 落在同一个组里，后触发
  # 的会把前一条掐掉——2026-09-04 实测：iPhone 那轮 setup 成功、capture 0 秒
  # 被 cancel，而我当时以为是 matrix 没展开。
  group: screenshots-${{ github.ref }}-${{ github.event.inputs.display_types }}
  cancel-in-progress: true

jobs:
  # 把 "A B" 转成 ["A","B"] 供下面的 matrix 用。
  #
  # 为什么要单独一个 job：GitHub 的表达式语言**没有 split()**——可用的只有
  # contains / startsWith / endsWith / format / join / toJSON / fromJSON /
  # hashFiles。第一版直接写了 split()，dispatch 时被拒：
  #
  #     Unrecognized function: 'split'
  #
  # 换成让 shell 转一遍再经 outputs 传出去。代价是多一次 runner 启动（约 30 秒），
  # 换来 display_types 这个输入仍然可以按人话写空格分隔，而不是逼人手打 JSON。
  setup:
    runs-on: ubuntu-latest
    outputs:
      display_types: ${{ steps.parse.outputs.display_types }}
    steps:
      - id: parse
        env:
          RAW: ${{ github.event.inputs.display_types }}
        run: |
          set -euo pipefail
          JSON=$(printf '%s' "$RAW" | tr ' ' '\n' | grep -v '^$' \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "解析结果: $JSON"
          echo "display_types=$JSON" >> "$GITHUB_OUTPUT"

  capture:
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 300

    # 按显示类型并行，不按 (类型 × 语言) 并行。
    #
    # 实测一个组合 25 分钟，10 个组合串行是四个多小时，超过 GitHub 单 job 的
    # 六小时上限之前先撞上我们自己的 timeout。拆成每个显示类型一个 job：两个
    # job 并行，各自编译一次、跑五种语言，墙钟时间减半。
    #
    # 不拆到「每个组合一个 job」：那样十个 runner 各编译一次 App，编译的总开销
    # 反而超过省下来的等待，产物还要再合并一次。
    strategy:
      fail-fast: false
      matrix:
        display_type: ${{ fromJSON(needs.setup.outputs.display_types) }}

    steps:
      - uses: actions/checkout@v4

      # runner 镜像里的 Xcode 与模拟器列表会随 GitHub 更新漂移。哪天挂了，
      # 第一眼要能看出是不是换了镜像。
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|iPad' || true

      # 每个 (displayType, locale) 组合一轮。
      #
      # 不用 matrix：matrix 会把每个组合分到独立的 runner，而 10 个 runner 各
      # 装一次 Xcode 环境、各跑一次构建，比串行还慢，产物还要再合并一次。
      - name: Capture
        env:
          LOCALES: ${{ github.event.inputs.locales }}
          DISPLAY_TYPES: ${{ matrix.display_type }}
          # 截图账号。仓库是公开的，凭据只能走 secrets，绝不能落进文件。
          # 没配也能跑——App 会退回访客模式，只是 Notifications 那一屏拍不到，
          # 对应的用例会失败（而不是悄悄拍下 Dashboard）。
          UI_TEST_USERNAME: ${{ secrets.UI_TEST_USERNAME }}
          UI_TEST_PASSWORD: ${{ secrets.UI_TEST_PASSWORD }}
          # 只重拍某一张时用。全套七条要跑四十多分钟，而单条约十分钟。
          ONLY_TESTING: ${{ github.event.inputs.only_testing }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for DT in $DISPLAY_TYPES; do
            PICKED=$(xcrun simctl list devices available --json \
              | python3 ios/scripts/pick_screenshot_device.py "$DT")
            UDID=$(echo "$PICKED" | cut -f1)
            echo "::group::$DT → $(echo "$PICKED" | cut -f2-3)"

            # 先启动模拟器再跑测试。第一次跑时四条用例失败在
            # "Failed to launch" / "Failed to get matching snapshots"——冷启动
            # 的模拟器要一分多钟才能接受第一次 App launch，而测试等不了那么久。
            xcrun simctl bootstatus "$UDID" -b || true

            # 编译一次，之后每种语言只跑不编。原先每轮都走 xcodebuild test，
            # 十轮就编译十遍；单轮总耗时 25 分钟里编译占了相当一部分。
            # 编译用 generic 目标，不绑具体设备。
            #
            # 绑 id 的话，CoreSimulator 偶尔会在这一步枚举不到任何模拟器：
            #   xcodebuild: error: Unable to find a device matching { id:… }
            #   Available destinations: （只剩 My Mac 和两个 placeholder）
            # 2026-09-04 实测撞到一次，而同一条流水线四十分钟前刚跑成功过。
            # 编译产物与具体设备无关，没必要承担这个风险；真正需要那台设备的是
            # 下面的 test-without-building。
            xcodebuild build-for-testing \
              -project ios/FlatRadar/FlatRadar.xcodeproj \
              -scheme FlatRadar \
              -testPlan Screenshots \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath dd \
              CODE_SIGNING_ALLOWED=NO \
              > "log-build-$DT.txt" 2>&1 || { tail -40 "log-build-$DT.txt"; exit 1; }

            # 一次 xcodebuild test 跑完全部语言。
            #
            # 语言由 Screenshots.xctestplan 的五个 configuration 声明，不再靠外
            # 层 shell 循环 + 环境变量传。此前那套踩过一个大坑：xcodebuild 不转
            # 发不带 TEST_RUNNER_ 前缀的环境变量，五种语言于是跑出五套一模一样
            # 的英文截图，而张数和尺寸全都合格。test plan 把语言变成构建配置的
            # 一部分，这个坑从根上消失。
            #
            # 顺带省掉四次重复安装：原先每种语言都要重新装一遍 App。
            set +e
            TEST_RUNNER_UI_TEST_USERNAME="${UI_TEST_USERNAME:-}" \
            TEST_RUNNER_UI_TEST_PASSWORD="${UI_TEST_PASSWORD:-}" \
            xcodebuild test-without-building \
              -project ios/FlatRadar/FlatRadar.xcodeproj \
              -scheme FlatRadar \
              -testPlan Screenshots \
              -destination "id=$UDID" \
              -resultBundlePath "rb-$DT.xcresult" \
              -derivedDataPath dd \
              -retry-tests-on-failure -test-iterations 3 \
              -maximum-concurrent-test-simulator-destinations 1 \
              CODE_SIGNING_ALLOWED=NO \
              > "log-$DT.txt" 2>&1
            RC=$?
            set -e
            tail -40 "log-$DT.txt"
            echo "xcodebuild 退出码 ${RC}（仅供参考，成败以 verify 为准）"

            # 提取时按 configuration 分桶——五种语言的附件都在同一个 xcresult 里，
            # manifest 的 configurationName 就是 test plan 里的语言名。
            python3 ios/scripts/extract_screenshots.py \
              "rb-$DT.xcresult" "screenshots/$DT" || true

            echo "::endgroup::"
          done

      # 绿色必须由产出背书：张数对、尺寸对，缺一不可。
      # 尺寸不是猜的——是从 ASC 上现有截图读出来的实际像素。
      - name: Verify
        env:
          LOCALES: ${{ github.event.inputs.locales }}
          DISPLAY_TYPES: ${{ matrix.display_type }}
          ONLY_TESTING: ${{ github.event.inputs.only_testing }}
        run: |
          set -euo pipefail
          FAIL=0
          for DT in $DISPLAY_TYPES; do
            case "$DT" in
              APP_IPHONE_61)          W=1206; H=2622 ;;
              APP_IPHONE_67)          W=1320; H=2868 ;;
              APP_IPAD_PRO_3GEN_129)  W=2064; H=2752 ;;
              *) echo "未登记尺寸: $DT"; exit 1 ;;
            esac
            # 遍历实际产出的语言目录，而不是遍历输入的语言列表——语言现在由
            # test plan 决定，输入里那份可能已经对不上了。
            FOUND=0
            for D in screenshots/$DT/*/; do
              [ -d "$D" ] || continue
              FOUND=$((FOUND+1))
              EXPECT=7
              [ -n "${ONLY_TESTING:-}" ] && EXPECT=0
              python3 ios/scripts/verify_screenshots.py "$D" \
                --expect "$EXPECT" --width "$W" --height "$H" || FAIL=1
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::$DT 一个语言目录都没产出"
              FAIL=1
            elif [ -z "${ONLY_TESTING:-}" ] && [ "$FOUND" -ne 5 ]; then
              echo "::error::$DT 只产出了 $FOUND 种语言，期望 5 种"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ matrix.display_type }}
          path: screenshots
          retention-days: 14

      # 失败时要能看出是哪一轮、卡在哪个页面。
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-logs-${{ matrix.display_type }}
          path: |
            log-*.txt
            rb-*.xcresult
          retention-days: 7
