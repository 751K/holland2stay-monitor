  {% if inbox_user %}<form method="post" action="{{ url_for('inbox_mark_read',listing_id=item.id) }}" class="mail-listing-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="view" value="{{ view }}"><input type="hidden" name="q" value="{{ search }}"><input type="hidden" name="page" value="{{ page }}">{% include '_workspace_fields.html' %}<button type="submit" class="mail-listing{% if item.is_unread %} is-unread{% endif %}{% if selected and item.id==selected.id %} selected{% endif %}" data-listing-id="{{ item.id }}" data-selected-url="{{ inbox_url(selected=item.id) }}" {% if selected and item.id==selected.id %}aria-current="true"{% endif %}>{% else %}
  <a class="mail-listing{% if selected and item.id==selected.id %} selected{% endif %}" href="{{ inbox_url(selected=item.id) }}" data-no-transition data-listing-id="{{ item.id }}" {% if selected and item.id==selected.id %}aria-current="true"{% endif %}>{% endif %}
    <span class="mail-listing-body"><strong>{{ item.display_title }}{% if item.is_unread %} <small class="mail-unread-label">{{ '未读' if lang == 'zh' else 'Unread' }}</small>{% endif %}{% if item.is_match %} <small class="mail-match-label" title="{{ '符合你的筛选，会收到通知' if lang == 'zh' else 'Matches your filters; you get notified' }}">{{ '匹配' if lang == 'zh' else 'Match' }}</small>{% endif %}</strong><span class="mail-meta">{% if item.display_address %}{{ item.display_address }} · {% endif %}{{ item.city }} · {{ item.display_source }}{% if item.area is not none %} · {{ item.area }} m²{% endif %}</span><span class="mail-listing-status">{{ item.display_status }}{% if item.status_is_inferred %} <small>{{ '系统推测' if lang == 'zh' else 'Inferred' }}</small>{% endif %}<time datetime="{{ item.first_seen | local_time('%Y-%m-%dT%H:%M:%S%z') }}">{{ item.first_seen | local_time('%H:%M') }}</time></span></span><span class="mail-value"><strong>{{ item.price_raw or ('价格未提供' if lang == 'zh' else 'Price unavailable') }}</strong></span>
  {% if inbox_user %}</button></form>{% else %}</a>{% endif %}
